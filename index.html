<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRAND AZURE HOTEL</title>

<style>
body {margin:0;font-family:Arial;background:#111;color:#fff}
header {display:flex;justify-content:space-between;padding:15px 30px;background:#000}
nav button {margin:0 5px;padding:10px;background:#333;color:#fff;border:none;cursor:pointer}
nav button.active {background:#c9a86a}
.page {display:none;padding:20px}
.page.active {display:block}
.hero {height:80vh;background:url('beach.jpg') center/cover;display:flex;align-items:center;justify-content:center}
.hero h2 {font-size:48px}
.cat-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.cat-item {background:#222;border-radius:10px;overflow:hidden;text-align:center}
.cat-item img {width:100%;height:180px;object-fit:cover}
.cat-label {padding:10px;font-weight:bold}
</style>

</head>

<body>

<header>
  <h2>GRAND AZURE</h2>
  <nav>
    <button onclick="showPage('home',this)" class="active">HOME</button>
    <button onclick="showPage('categories',this)">HOTEL TYPES</button>
    <button onclick="showPage('rooms',this)">ROOMS</button>
  </nav>
</header>

<!-- HOME -->

<div id="page-home" class="page active">
  <section class="hero">
    <h2>Escape Into Luxury</h2>
  </section>
</div>

<!-- CATEGORIES -->

<div id="page-categories" class="page">
  <h2>Hotel Types</h2>

  <div class="cat-grid">

```
<div class="cat-item">
  <img src="beach.jpg" alt="Beach">
  <div class="cat-label">Beach</div>
</div>

<div class="cat-item">
  <img src="bedroom1.jpg" alt="Royal Suite">
  <div class="cat-label">Royal Suite</div>
</div>

<div class="cat-item">
  <img src="villa.jpg" alt="Villa">
  <div class="cat-label">Villa</div>
</div>

<div class="cat-item">
  <img src="hotel.jpg" alt="Hotel">
  <div class="cat-label">Hotel</div>
</div>

<div class="cat-item">
  <img src="room2.jpg" alt="Double Room">
  <div class="cat-label">Double Room</div>
</div>

<div class="cat-item">
  <img src="bedroom2.jpg" alt="Single Room">
  <div class="cat-label">Single Room</div>
</div>
```

  </div>
</div>

<!-- ROOMS -->

<div id="page-rooms" class="page">
  <h2>Booking</h2>

<label>Select Room:</label> <select id="roomSelect" onchange="calculateTotal()"> <option value="90">Single Room - $90</option> <option value="150">Double Room - $150</option> <option value="300">Royal Suite - $300</option> </select>

<br><br>

<label>Nights:</label> <input type="number" id="nightsInput" value="1" min="1" onchange="calculateTotal()">

  <h3>Total: <span id="totalCost">$90</span></h3>

<button onclick="confirmReservation()">Confirm</button>

</div>

<script>
function showPage(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  btn.classList.add('active');
}

function calculateTotal(){
  let price = document.getElementById('roomSelect').value;
  let nights = document.getElementById('nightsInput').value;
  document.getElementById('totalCost').innerText = '$' + (price*nights);
}

function confirmReservation(){
  alert("Reservation Confirmed!");
}
</script>

</body>
</html>
